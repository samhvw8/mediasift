[project]
name = "mediasift"
version = "0.3.0"
description = "A video and sound sensor for agents: one command turns a video into a timeline card of picture events, named and counted sounds, speech and on-screen text, plus frame sheets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "siftasr @ git+https://github.com/samhvw8/siftasr",
    "numpy>=2.0",
    "pillow>=10",
    "pyobjc-framework-quartz>=12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-vision>=12.2.2 ; sys_platform == 'darwin'",
    "indra-ocr>=0.3.2",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core>=1.13.8",
    # Speech is part of sensing: faster-whisper everywhere, MLX backends on Apple Silicon.
    "faster-whisper>=1.0",
    "parakeet-mlx>=0.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Vietnamese on Apple Silicon: QUAN-Transcribe as Core ML, run through pyobjc (no PyTorch, no coremltools).
    "pyobjc-framework-coreml>=12.2.2 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "huggingface-hub>=0.23",
]

[project.optional-dependencies]
# Kept so older install commands keep working; the default install already has these.
asr = ["faster-whisper>=1.0"]
meaning = ["fastembed>=0.5"]
mlx = [
  "faster-whisper>=1.0",
  "parakeet-mlx>=0.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
mediasift = "mediasift.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediasift"]


[tool.hatch.metadata]
allow-direct-references = true
[tool.pytest.ini_options]
pythonpath = ["tests", "src"]
