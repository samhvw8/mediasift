[tools]
python = "3.14"
uv = "latest"
# llama-server for `index` / `find` (EmbeddingGemma 2 needs b11501 or later). The Linux CUDA
# asset ships its CUDA libraries separately, so a GPU box builds llama.cpp itself.
[tools."github:ggml-org/llama.cpp"]
version = "b11501"
platforms = { macos-arm64 = { asset_pattern = "llama-*-bin-macos-arm64.tar.gz" }, linux-x64 = { asset_pattern = "llama-*-bin-ubuntu-x64.tar.gz" } }

[tasks.test]
run = "uv run pytest -q"

[tasks.demo]
description = "Analyze the synthetic fixture video end to end"
run = "uv run python tests/make_fixture.py /tmp/framesift-fixture.mp4 && uv run framesift analyze /tmp/framesift-fixture.mp4 -o /tmp/framesift-demo"

[tasks.samples]
description = "Fetch the test corpus into samples/ (gitignored)"
run = "./samples/fetch.sh"

[tasks.ced-coreml]
description = "Build the Core ML sound tagger once (CED-small on the GPU, 4.5x the CPU tagger); framesift falls back to the CPU without it"
run = """
uv run --no-project --python 3.13 --with torch==2.7.0 --with torchaudio==2.7.0 --with coremltools==9.0 \
  --with transformers==4.46.3 python scripts/ced_coreml.py "$(uv run python -c 'from framesift.sound import ced_coreml_package as p; print(p().parent)')"
"""
